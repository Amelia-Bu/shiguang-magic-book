<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#FBF6EC">
<title>拾光手账 · 上着锁</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FBF6EC'/%3E%3Cpath d='M9 8h6.6c.8 0 1.4.6 1.4 1.4V24c0-.7-.6-1.3-1.4-1.3H9z' fill='%23D98BA4'/%3E%3Cpath d='M23 8h-6.6c-.8 0-1.4.6-1.4 1.4V24c0-.7.6-1.3 1.4-1.3H23z' fill='%23B9A9D6'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; align-items: center; justify-content: center;
    padding: 28px; background: #FBF6EC; color: #2E2723;
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 80% at 16% 6%, rgba(217,139,164,.17), transparent 60%),
      radial-gradient(110% 80% at 88% 94%, rgba(185,169,214,.19), transparent 62%);
  }
  .card {
    position: relative; width: 100%; max-width: 396px; padding: 46px 34px 32px;
    background: rgba(255,253,248,.93);
    border: 1px solid rgba(46,39,35,.13); border-radius: 18px;
    box-shadow: 0 24px 52px -30px rgba(70,48,38,.45), 0 2px 0 rgba(255,255,255,.85) inset;
    text-align: center;
  }
  .card::after {
    content: ""; position: absolute; inset: 9px; border: 1px dashed rgba(46,39,35,.13);
    border-radius: 11px; pointer-events: none;
  }
  .tape {
    position: absolute; top: -11px; left: 50%; width: 74px; height: 22px;
    margin-left: -37px; background: rgba(217,139,164,.26);
    border-left: 1px solid rgba(217,139,164,.3); border-right: 1px solid rgba(217,139,164,.3);
    transform: rotate(-2deg);
  }
  .kicker {
    margin: 0 0 17px; font-size: 11px; letter-spacing: .36em; text-transform: uppercase;
    color: #8A7C6E; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  h1 { margin: 0 0 11px; font-size: 26px; font-weight: 600; letter-spacing: .09em; }
  .sub { margin: 0 0 26px; font-size: 14px; line-height: 1.75; color: #6E6154; }
  form { position: relative; z-index: 1; }
  input[type=password] {
    width: 100%; padding: 14px 16px; font-size: 16px; letter-spacing: .2em; text-align: center;
    color: #2E2723; background: #FFFDF8;
    border: 1px solid rgba(46,39,35,.22); border-radius: 11px; outline: none;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  input[type=password]:focus { border-color: #C9708C; box-shadow: 0 0 0 4px rgba(217,139,164,.16); }
  input[type=password]::placeholder { letter-spacing: .3em; color: #BFAF9F; }
  button {
    width: 100%; margin-top: 14px; padding: 14px 16px;
    font-size: 15px; letter-spacing: .18em; color: #FFFDF8; background: #B5738B;
    border: 0; border-radius: 11px; cursor: pointer; font-family: inherit;
    transition: background .18s ease, transform .1s ease, opacity .18s ease;
  }
  button:hover:not(:disabled) { background: #A2627A; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .62; cursor: progress; }
  .msg {
    margin: 19px 0 0; min-height: 18px; font-size: 12.5px; line-height: 1.6; color: #9A8B7C;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .msg.bad { color: #A83E4E; }
  .foot {
    margin: 24px 0 0; font-size: 10.5px; letter-spacing: .22em; color: #B3A597;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .bar {
    height: 2px; margin-top: 16px; border-radius: 2px; overflow: hidden;
    background: rgba(46,39,35,.08); opacity: 0; transition: opacity .2s ease;
  }
  .bar.on { opacity: 1; }
  .bar i {
    display: block; height: 100%; width: 34%; border-radius: 2px; background: #C9708C;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(420%); }
  }
</style>
</head>
<body>

<div class="card">
  <span class="tape"></span>
  <p class="kicker">Paper Memory</p>
  <h1>拾光手账</h1>
  <p class="sub">这本书上着锁。<br>只有拿到钥匙的人，才翻得开。</p>

  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="输 入 密 码" aria-label="访问密码"
           autocomplete="current-password" required>
    <button id="go" type="submit">翻 开 这 本 书</button>
  </form>

  <div class="bar" id="bar"><i></i></div>
  <p class="msg" id="msg">25.7 MB 的书页，正等着被翻开。</p>
  <p class="foot">A MAGIC BOOK · 二〇二六</p>
</div>

<script>
(function () {
  'use strict';

  var ITER = 150000;
  var $ = function (id) { return document.getElementById(id); };
  var msgEl = $('msg'), barEl = $('bar'), goEl = $('go'), pwEl = $('pw');

  function say(text, bad) {
    msgEl.textContent = text;
    msgEl.className = bad ? 'msg bad' : 'msg';
  }

  function ext(name) {
    var i = name.lastIndexOf('.');
    return i < 0 ? '' : name.slice(i + 1).toLowerCase();
  }

  var MIME = {
    webp: 'image/webp', mp4: 'video/mp4', mp3: 'audio/mpeg', m4a: 'audio/mp4',
    css: 'text/css', js: 'text/javascript', json: 'application/json',
    html: 'text/html', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
    svg: 'image/svg+xml', gif: 'image/gif',
    woff2: 'font/woff2', woff: 'font/woff', ttf: 'font/ttf', otf: 'font/otf'
  };
  var TEXT = { js: 1, css: 1, json: 1, html: 1 };

  function unpack(u8) {
    var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    var p = 4;
    var n = dv.getUint32(p, true); p += 4;
    var dec = new TextDecoder();
    var map = new Map();
    for (var i = 0; i < n; i++) {
      var nl = dv.getUint16(p, true); p += 2;
      var name = dec.decode(u8.subarray(p, p + nl)); p += nl;
      var dl = dv.getUint32(p, true); p += 4;
      map.set(name, u8.subarray(p, p + dl)); p += dl;
    }
    return map;
  }

  function deriveKey(pw, salt) {
    var base = crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return base.then(function (k) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
        k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
    });
  }

  function rewrite(text, urls, order) {
    for (var i = 0; i < order.length; i++) {
      var p = order[i];
      if (text.indexOf(p) < 0) continue;
      text = text.split(p).join(urls.get(p));
    }
    return text;
  }

  function unlock(pw) {
    barEl.className = 'bar on';
    goEl.disabled = true;
    say('正在取回书页…');

    return fetch('site.bin', { cache: 'force-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('NET');
        return r.arrayBuffer();
      })
      .then(function (buf) {
        var u8 = new Uint8Array(buf);
        var magic = String.fromCharCode(u8[0], u8[1], u8[2], u8[3]);
        if (magic !== 'SGE1') throw new Error('FORMAT');

        var salt = u8.slice(4, 20);
        var iv = u8.slice(20, 32);
        var ct = u8.slice(32);

        say('正在对钥匙…');
        return deriveKey(pw, salt).then(function (key) {
          say('正在解开书页…');
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, key, ct);
        }).catch(function () {
          throw new Error('WRONG');
        });
      })
      .then(function (plain) {
        var map = unpack(new Uint8Array(plain));
        if (!map.has('index.html')) throw new Error('FORMAT');
        say('正在铺开纸页…');
        return render(map);
      })
      .catch(function (err) {
        var code = err && err.message;
        barEl.className = 'bar';
        goEl.disabled = false;
        if (code === 'WRONG') { say('钥匙不对，再想想？', true); pwEl.select(); }
        else if (code === 'NET') { say('书页没有送达，检查一下网络。', true); }
        else if (code === 'FORMAT') { say('这本书的封装坏了。', true); }
        else { say('打不开了：' + code, true); }
      });
  }

  function render(map) {
    var urls = new Map();
    var all = Array.from(map.keys());
    var bin = all.filter(function (p) { return !TEXT[ext(p)]; })
                 .sort(function (a, b) { return b.length - a.length; });

    bin.forEach(function (p) {
      var e = ext(p);
      urls.set(p, URL.createObjectURL(new Blob([map.get(p)], { type: MIME[e] || 'application/octet-stream' })));
    });

    var dec = new TextDecoder();
    var leftovers = [];

    all.forEach(function (p) {
      var e = ext(p);
      if (!TEXT[e] || e === 'html') return;
      var txt = rewrite(dec.decode(map.get(p)), urls, bin);
      if (/["'(]assets\//.test(txt)) leftovers.push(p);
      urls.set(p, URL.createObjectURL(new Blob([txt], { type: MIME[e] })));
    });

    var html = rewrite(dec.decode(map.get('index.html')), urls, all.slice().sort(function (a, b) { return b.length - a.length; }));
    if (/["'(]assets\//.test(html)) leftovers.push('index.html');
    if (leftovers.length) throw new Error('残留 ' + leftovers.join(','));

    document.open();
    document.write(html);
    document.close();
  }

  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = pwEl.value;
    if (!pw) { say('先输入钥匙。', true); return; }
    unlock(pw);
  });

  if (!window.crypto || !crypto.subtle) {
    say('这个浏览器打不开加密的书，换一个试试。', true);
    goEl.disabled = true;
  }
})();
</script>
</body>
</html>
